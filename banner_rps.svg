<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>
    <linearGradient id="pinkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff007f" />
      <stop offset="100%" stop-color="#9d4edd" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="640" height="360" fill="url(#bgGrad)" />

  <!-- Subtle Ambient Glow Orbs -->
  <circle cx="160" cy="180" r="100" fill="#00f2fe" opacity="0.12" filter="url(#glow)" />
  <circle cx="480" cy="180" r="100" fill="#ff007f" opacity="0.12" filter="url(#glow)" />

  <!-- Center Card: Rock (Fist) -->
  <g transform="translate(140, 180)">
    <rect x="-55" y="-70" width="110" height="140" rx="18" fill="#1e293b" stroke="#334155" stroke-width="2" />
    <circle cx="0" cy="-10" r="28" fill="url(#cyanGrad)" />
    <!-- Minimalist Fist shape -->
    <path d="M-14,-2 Q-14,-22 0,-22 Q14,-22 14,-2 L14,10 Q14,18 0,18 Q-14,18 -14,10 Z" fill="#0f172a" opacity="0.4" />
    <text x="0" y="48" font-family="'Outfit', sans-serif" font-size="14" font-weight="700" fill="#94a3b8" text-anchor="middle">ROCK</text>
  </g>

  <!-- Center Card: Paper (Hand) -->
  <g transform="translate(320, 180)">
    <rect x="-60" y="-76" width="120" height="152" rx="20" fill="#1e293b" stroke="#00f2fe" stroke-width="3" filter="url(#glow)" />
    <circle cx="0" cy="-12" r="32" fill="#00f2fe" opacity="0.2" />
    <!-- Minimalist Paper icon -->
    <rect x="-18" y="-32" width="36" height="42" rx="4" fill="url(#cyanGrad)" />
    <line x1="-10" y1="-20" x2="10" y2="-20" stroke="#0f172a" stroke-width="3" stroke-linecap="round" />
    <line x1="-10" y1="-10" x2="10" y2="-10" stroke="#0f172a" stroke-width="3" stroke-linecap="round" />
    <line x1="-10" y1="0" x2="4" y2="0" stroke="#0f172a" stroke-width="3" stroke-linecap="round" />
    <text x="0" y="52" font-family="'Outfit', sans-serif" font-size="16" font-weight="800" fill="#00f2fe" text-anchor="middle">PAPER</text>
  </g>

  <!-- Right Card: Scissors -->
  <g transform="translate(500, 180)">
    <rect x="-55" y="-70" width="110" height="140" rx="18" fill="#1e293b" stroke="#334155" stroke-width="2" />
    <circle cx="0" cy="-10" r="28" fill="url(#pinkGrad)" />
    <!-- Minimalist Scissors -->
    <circle cx="-8" cy="8" r="8" fill="none" stroke="#fff" stroke-width="3" />
    <circle cx="8" cy="8" r="8" fill="none" stroke="#fff" stroke-width="3" />
    <line x1="-6" y1="2" x2="12" y2="-22" stroke="#fff" stroke-width="3" stroke-linecap="round" />
    <line x1="6" y1="2" x2="-12" y2="-22" stroke="#fff" stroke-width="3" stroke-linecap="round" />
    <text x="0" y="48" font-family="'Outfit', sans-serif" font-size="14" font-weight="700" fill="#94a3b8" text-anchor="middle">SCISSORS</text>
  </g>

  <!-- VS Clash Badge -->
  <g transform="translate(320, 48)">
    <rect x="-65" y="-18" width="130" height="36" rx="18" fill="#0f172a" stroke="#334155" stroke-width="1.5" />
    <text x="0" y="6" font-family="'Space Grotesk', sans-serif" font-size="14" font-weight="800" fill="#ffb300" text-anchor="middle" letter-spacing="2">DUEL ARENA</text>
  </g>
</svg>
