<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradDice" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1220" />
      <stop offset="100%" stop-color="#081e2b" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#000" flood-opacity="0.5" />
    </filter>
  </defs>

  <rect width="640" height="360" fill="url(#bgGradDice)" />

  <!-- Felt Tray Circle -->
  <ellipse cx="320" cy="200" rx="220" ry="110" fill="#111d33" stroke="#1e293b" stroke-width="2" />

  <!-- Left Die (Isometric 3D) -->
  <g transform="translate(240, 170)" filter="url(#shadow)">
    <!-- Top Face -->
    <polygon points="0,-48 56,-16 0,16 -56,-16" fill="#f8fafc" />
    <!-- Pip 1 center red -->
    <ellipse cx="0" cy="-16" rx="8" ry="5" fill="#ef4444" />

    <!-- Left Face (5 pips) -->
    <polygon points="-56,-16 0,16 0,80 -56,48" fill="#cbd5e1" />
    <circle cx="-38" cy="8" r="4.5" fill="#0f172a" />
    <circle cx="-18" cy="20" r="4.5" fill="#0f172a" />
    <circle cx="-28" cy="32" r="4.5" fill="#0f172a" />
    <circle cx="-38" cy="44" r="4.5" fill="#0f172a" />
    <circle cx="-18" cy="56" r="4.5" fill="#0f172a" />

    <!-- Right Face (3 pips) -->
    <polygon points="0,16 56,-16 56,48 0,80" fill="#94a3b8" />
    <circle cx="18" cy="20" r="4.5" fill="#0f172a" />
    <circle cx="28" cy="32" r="4.5" fill="#0f172a" />
    <circle cx="38" cy="44" r="4.5" fill="#0f172a" />
  </g>

  <!-- Right Die (Isometric 3D) -->
  <g transform="translate(390, 195)" filter="url(#shadow)">
    <!-- Top Face (6 pips) -->
    <polygon points="0,-44 50,-15 0,14 -50,-15" fill="#ffffff" />
    <ellipse cx="-22" cy="-21" rx="4" ry="2.5" fill="#0f172a" />
    <ellipse cx="0" cy="-21" rx="4" ry="2.5" fill="#0f172a" />
    <ellipse cx="22" cy="-21" rx="4" ry="2.5" fill="#0f172a" />
    <ellipse cx="-22" cy="-9" rx="4" ry="2.5" fill="#0f172a" />
    <ellipse cx="0" cy="-9" rx="4" ry="2.5" fill="#0f172a" />
    <ellipse cx="22" cy="-9" rx="4" ry="2.5" fill="#0f172a" />

    <!-- Left Face -->
    <polygon points="-50,-15 0,14 0,72 -50,43" fill="#cbd5e1" />
    <circle cx="-25" cy="15" r="4.5" fill="#0f172a" />
    <circle cx="-25" cy="42" r="4.5" fill="#0f172a" />

    <!-- Right Face -->
    <polygon points="0,14 50,-15 50,43 0,72" fill="#94a3b8" />
    <circle cx="15" cy="18" r="4.5" fill="#0f172a" />
    <circle cx="35" cy="10" r="4.5" fill="#0f172a" />
    <circle cx="15" cy="48" r="4.5" fill="#0f172a" />
    <circle cx="35" cy="40" r="4.5" fill="#0f172a" />
  </g>

  <!-- Top Badge -->
  <g transform="translate(320, 48)">
    <rect x="-65" y="-18" width="130" height="36" rx="18" fill="#0f172a" stroke="#334155" stroke-width="1.5" />
    <text x="0" y="6" font-family="'Space Grotesk', sans-serif" font-size="14" font-weight="800" fill="#38bdf8" text-anchor="middle" letter-spacing="2">3D PHYSICS</text>
  </g>
</svg>
