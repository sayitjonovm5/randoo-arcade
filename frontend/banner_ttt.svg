<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradTTT" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#16122a" />
    </linearGradient>
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="glowPink" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="640" height="360" fill="url(#bgGradTTT)" />

  <!-- Center 3x3 Minimalist Grid -->
  <g transform="translate(320, 180)">
    <!-- Grid Lines -->
    <line x1="-80" y1="-120" x2="-80" y2="120" stroke="#334155" stroke-width="4" stroke-linecap="round" />
    <line x1="80" y1="-120" x2="80" y2="120" stroke="#334155" stroke-width="4" stroke-linecap="round" />
    <line x1="-120" y1="-80" x2="120" y2="-80" stroke="#334155" stroke-width="4" stroke-linecap="round" />
    <line x1="-120" y1="80" x2="120" y2="80" stroke="#334155" stroke-width="4" stroke-linecap="round" />

    <!-- Top Left: X -->
    <g transform="translate(-160, -80)">
      <line x1="-22" y1="-22" x2="22" y2="22" stroke="#00f2fe" stroke-width="8" stroke-linecap="round" filter="url(#glowCyan)" />
      <line x1="22" y1="-22" x2="-22" y2="22" stroke="#00f2fe" stroke-width="8" stroke-linecap="round" filter="url(#glowCyan)" />
    </g>

    <!-- Top Middle: O -->
    <g transform="translate(0, -80)">
      <circle cx="0" cy="0" r="26" fill="none" stroke="#ff007f" stroke-width="7" filter="url(#glowPink)" />
    </g>

    <!-- Center: X -->
    <g transform="translate(0, 0)">
      <line x1="-24" y1="-24" x2="24" y2="24" stroke="#00f2fe" stroke-width="8" stroke-linecap="round" filter="url(#glowCyan)" />
      <line x1="24" y1="-24" x2="-24" y2="24" stroke="#00f2fe" stroke-width="8" stroke-linecap="round" filter="url(#glowCyan)" />
    </g>

    <!-- Center Right: O -->
    <g transform="translate(160, 0)">
      <circle cx="0" cy="0" r="26" fill="none" stroke="#ff007f" stroke-width="7" filter="url(#glowPink)" />
    </g>

    <!-- Bottom Right: X (Winning Triplet on Diagonal) -->
    <g transform="translate(160, 80)">
      <line x1="-22" y1="-22" x2="22" y2="22" stroke="#00f2fe" stroke-width="8" stroke-linecap="round" filter="url(#glowCyan)" />
      <line x1="22" y1="-22" x2="-22" y2="22" stroke="#00f2fe" stroke-width="8" stroke-linecap="round" filter="url(#glowCyan)" />
    </g>

    <!-- Bottom Left: O -->
    <g transform="translate(-160, 80)">
      <circle cx="0" cy="0" r="26" fill="none" stroke="#ff007f" stroke-width="7" filter="url(#glowPink)" />
    </g>

    <!-- Diagonal Winning Strike Line -->
    <line x1="-180" y1="-100" x2="180" y2="100" stroke="#00e676" stroke-width="6" stroke-linecap="round" filter="url(#glowCyan)" />
  </g>

  <!-- Top Badge -->
  <g transform="translate(320, 48)">
    <rect x="-65" y="-18" width="130" height="36" rx="18" fill="#0f172a" stroke="#334155" stroke-width="1.5" />
    <text x="0" y="6" font-family="'Space Grotesk', sans-serif" font-size="14" font-weight="800" fill="#00f2fe" text-anchor="middle" letter-spacing="2">MINIMAX AI</text>
  </g>
</svg>
