<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradRTT" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1215" />
      <stop offset="100%" stop-color="#0b1e16" />
    </linearGradient>
    <filter id="glowGreen" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="640" height="360" fill="url(#bgGradRTT)" />

  <!-- Stopwatch Body -->
  <g transform="translate(320, 185)">
    <!-- Outer Ring / Speed Gauge -->
    <circle cx="0" cy="0" r="90" fill="#0f172a" stroke="#1e293b" stroke-width="8" />
    <!-- Active Green Target Arc -->
    <circle cx="0" cy="0" r="90" fill="none" stroke="#00e676" stroke-width="8" stroke-dasharray="380 200" stroke-linecap="round" filter="url(#glowGreen)" />

    <!-- Top Button / Crown -->
    <rect x="-10" y="-108" width="20" height="18" rx="4" fill="#334155" />

    <!-- Center Lightning Bolt -->
    <polygon points="4,-48 -18,-6 2,-6 -6,48 20,4 -2,4" fill="#00e676" filter="url(#glowGreen)" />

    <!-- Millisecond Digital Readout -->
    <rect x="-55" y="42" width="110" height="30" rx="6" fill="#090d16" stroke="#1e293b" stroke-width="1.5" />
    <text x="0" y="63" font-family="'Space Grotesk', sans-serif" font-size="16" font-weight="700" fill="#00f2fe" text-anchor="middle" letter-spacing="1">0.215 s</text>
  </g>

  <!-- Top Badge -->
  <g transform="translate(320, 48)">
    <rect x="-70" y="-18" width="140" height="36" rx="18" fill="#0f172a" stroke="#334155" stroke-width="1.5" />
    <text x="0" y="6" font-family="'Space Grotesk', sans-serif" font-size="14" font-weight="800" fill="#00e676" text-anchor="middle" letter-spacing="2">BENCHMARK</text>
  </g>
</svg>
